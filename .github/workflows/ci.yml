name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Ein neuer Push auf denselben Branch macht den vorherigen Lauf überflüssig.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit-Tests
        run: npm test

      - name: Production-Build
        # Die Firebase-Config wird zur Buildzeit eingesetzt. Im CI stehen die
        # echten Werte nicht zur Verfügung und werden auch nicht gebraucht –
        # hier geht es nur darum, dass der Build durchläuft. Aus demselben
        # Grund der Notausgang für App Check: Dieser Build wird nie
        # ausgeliefert (siehe src/lib/appCheckConfig.ts).
        env:
          APP_CHECK_OPTIONAL: '1'
          VITE_FIREBASE_API_KEY: ci-dummy
          VITE_FIREBASE_AUTH_DOMAIN: ci-dummy.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-dummy
          VITE_FIREBASE_STORAGE_BUCKET: ci-dummy.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '0'
          VITE_FIREBASE_APP_ID: ci-dummy
        run: npm run build

  firestore-rules:
    name: Firestore-Sicherheitsregeln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Der Firestore-Emulator ist ein Java-Prozess.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Regeltests gegen den Emulator
        # Eigener Job, damit ein Emulator-Problem nicht wie ein fehlgeschlagener
        # Unit-Test aussieht – und damit beide Jobs parallel laufen.
        run: npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-2cars2georgia "npm run test:rules"
